name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run checks and unit tests
        run: |
          npm run check
          npm test

      - name: Build portable offline zip bundle
        run: |
          mkdir -p dist
          zip -r "dist/discrete-math-ii-visual-lab-${{ github.ref_name }}.zip" \
            index.html README.md LICENSE CONTRIBUTING.md DESIGN_PLAN.md css data js vendor

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/discrete-math-ii-visual-lab-${{ github.ref_name }}.zip" \
            --title "Discrete Math II Visual Lab ${{ github.ref_name }}" \
            --generate-notes
